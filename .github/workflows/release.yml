name: Release Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMake is preinstalled on GitHub-hosted runners; no install step needed.
      - name: Show CMake version
        shell: bash
        run: cmake --version

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cmake -S . -B build -G "Xcode"
          else
            cmake -S . -B build
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Package macOS bundles
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          cd build
          # Quoting matters: PRODUCT_NAME has a space in it. See ci.yml.
          if [ "$(find . \( -type d -name '*.vst3' -o -type d -name '*.component' \) | wc -l)" -eq 0 ]; then
            echo "No macOS plugin bundles found in build/"
            exit 1
          fi
          ZIPNAME=plugin-macos-${{ github.ref_name }}.zip
          find . \( -type d -name '*.vst3' -o -type d -name '*.component' \) -exec zip -ryq "$ZIPNAME" {} +
          echo "Packaged: $(pwd)/$ZIPNAME"

      - name: Package Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -Path build
          $vst3 = Get-ChildItem -Path . -Include *.vst3 -Recurse -ErrorAction SilentlyContinue
          if (-not $vst3) {
            Write-Error "No Windows plugin artifacts found"
          }
          $zip = "plugin-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path $vst3 -DestinationPath $zip -Force
          Write-Output "Packaged: $zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: build/plugin-*.zip
          if-no-files-found: error

  publish:
    name: Create Release and Upload Assets
    runs-on: ubuntu-latest
    needs: [ build ]
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -laR dist

      - name: Create draft GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: dist/plugin-*.zip

      # Gumroad upload is skipped unless both secrets are configured.
      # NOTE: the `secrets` context is NOT available in step-level `if:` conditions,
      # so the check must happen inside the script via env vars.
      - name: Optionally upload to Gumroad
        env:
          GUMROAD_PRODUCT_ID: ${{ secrets.GUMROAD_PRODUCT_ID }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GUMROAD_PRODUCT_ID:-}" ] || [ -z "${GUMROAD_ACCESS_TOKEN:-}" ]; then
            echo "Gumroad secrets not configured; skipping upload."
            exit 0
          fi
          ZIPFILE=$(ls -1 dist/plugin-*.zip | head -n1 || true)
          if [ -z "$ZIPFILE" ]; then
            echo "No zip file to upload"
            exit 0
          fi
          echo "Uploading $ZIPFILE to Gumroad product $GUMROAD_PRODUCT_ID"
          curl -sS -X POST "https://api.gumroad.com/v2/products/$GUMROAD_PRODUCT_ID/versions" \
            -F "access_token=$GUMROAD_ACCESS_TOKEN" \
            -F "file=@$ZIPFILE" \
            -F "release_notes=Automated release ${{ github.ref_name }} from CI"

      - name: Release summary
        run: echo "Draft release ${{ github.ref_name }} created. Review and publish it manually."
