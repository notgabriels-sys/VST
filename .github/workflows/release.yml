name: Release Candidate Build

on:
  push:
    tags:
      - v0.2.0-rc.*
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package_mac.sh
      - scripts/package_win.ps1
      - docs/CI_SECRETS.md
  workflow_dispatch:
    inputs:
      sign_artifacts:
        description: Use configured signing secrets for this private artifact-only test
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15-intel
          - platform: windows
            runner: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate release source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_CREATED: ${{ github.event.created }}
          SIGN_ARTIFACTS: ${{ inputs.sign_artifacts }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$SIGN_ARTIFACTS" = 'true' ]; then
            if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
              echo "::error::manual signing tests must run from the main branch."
              exit 1
            fi
          fi
          if [ "$REF_TYPE" = 'tag' ]; then
            if [ "$EVENT_NAME" = 'push' ] && [ "$REF_CREATED" != 'true' ]; then
              echo "::error::release tag push must create a new ref; updates and force-moves are forbidden."
              exit 1
            fi
            release_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
            git merge-base --is-ancestor "$release_commit" origin/main || {
              echo "::error::release tag must point to a commit contained in origin/main."
              exit 1
            }
          fi

      - name: Show CMake version
        shell: bash
        run: cmake --version

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cmake -S . -B build \
              '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            cmake -S . -B build
          fi

      - name: Verify pinned Khronos headers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $glext = Get-Item build/_deps/dpf-src/khronos/GL/glext.h
          $khrplatform = Get-Item build/_deps/dpf-src/khronos/KHR/khrplatform.h
          if ($glext.Length -eq 0 -or $khrplatform.Length -eq 0) {
            throw 'Pinned Khronos header is empty.'
          }
          if (-not (Select-String -Quiet -Path $glext.FullName -Pattern 'PFNGLACTIVETEXTUREPROC')) {
            throw 'Pinned glext.h is missing required OpenGL declarations.'
          }

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run behavioural tests
        shell: bash
        run: |
          set -euo pipefail
          for name in GranularFreezeEngineTests GranularFreezeCoreTests GranularFreezeContractTests; do
            test_binary=$(find build -type f \( -name "$name" -o -name "$name.exe" \) -print -quit)
            if [ -z "$test_binary" ]; then
              echo "$name binary not found under build/" >&2
              exit 1
            fi
            echo "running $test_binary"
            "$test_binary"
          done

      - name: Sign macOS bundles (Developer ID)
        id: mac_sign
        if: >-
          matrix.platform == 'macos' &&
          ((github.event_name == 'push' && github.ref_type == 'tag') ||
           (github.event_name == 'workflow_dispatch' && inputs.sign_artifacts))
        shell: bash
        env:
          MAC_CODESIGN_P12_BASE64: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
          MAC_CODESIGN_P12_PASSWORD: ${{ secrets.MAC_CODESIGN_P12_PASSWORD }}
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
          SIGNING_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_artifacts }}
        run: |
          set -euo pipefail

          present=0
          for value in "$MAC_CODESIGN_P12_BASE64" "$MAC_CODESIGN_P12_PASSWORD" \
                       "$MAC_CODESIGN_IDENTITY" "$MAC_KEYCHAIN_PASSWORD"; do
            [ -n "$value" ] && present=$((present + 1))
          done
          if [ "$present" -eq 0 ]; then
            if [ "$SIGNING_REQUIRED" = 'true' ]; then
              echo "::error::manual signing test requested, but macOS signing secrets are not configured."
              exit 1
            fi
            echo "signed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing secrets are not configured; keeping the ad-hoc signature."
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "::error::macOS signing secret set is incomplete; refusing to produce an ambiguously signed artifact."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          P12="$RUNNER_TEMP/cert.p12"
          cleanup() {
            rm -f "$P12"
            security delete-keychain "$KEYCHAIN" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # macOS runners provide BSD base64; GNU's --decode is not portable.
          printf '%s' "$MAC_CODESIGN_P12_BASE64" | base64 -D -o "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MAC_CODESIGN_P12_PASSWORD" \
                   -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
                   -k "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" |
            grep -F -- "$MAC_CODESIGN_IDENTITY" > /dev/null

          bundles=()
          while IFS= read -r -d '' bundle; do
            bundles+=("$bundle")
          done < <(find build -type d \
                    \( -name 'GranularFreeze.vst3' -o -name 'GranularFreeze.component' -o -name 'GranularFreeze.clap' \) \
                    -print0)
          if [ "${#bundles[@]}" -ne 3 ]; then
            echo "::error::expected exactly one VST3, AU, and CLAP bundle before signing; found ${#bundles[@]}."
            exit 1
          fi

          for bundle in "${bundles[@]}"; do
            echo "signing $bundle"
            codesign --force --deep --options runtime --timestamp \
                     --sign "$MAC_CODESIGN_IDENTITY" "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
            signature_info=$(codesign --display --verbose=4 "$bundle" 2>&1)
            grep -F 'Authority=Developer ID Application:' <<< "$signature_info" > /dev/null
            grep -F '(runtime)' <<< "$signature_info" > /dev/null
          done
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: Sign Windows binary (Authenticode)
        id: win_sign
        if: >-
          matrix.platform == 'windows' &&
          ((github.event_name == 'push' && github.ref_type == 'tag') ||
           (github.event_name == 'workflow_dispatch' && inputs.sign_artifacts))
        shell: pwsh
        env:
          WIN_PFX_BASE64: ${{ secrets.WIN_PFX_BASE64 }}
          WIN_PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
          SIGNING_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_artifacts }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $present = @(
            @($env:WIN_PFX_BASE64, $env:WIN_PFX_PASSWORD) |
              Where-Object { -not [string]::IsNullOrEmpty($_) }
          )
          if ($present.Count -eq 0) {
            if ($env:SIGNING_REQUIRED -eq 'true') {
              throw "manual signing test requested, but Windows signing secrets are not configured."
            }
            "win_signed=no" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Output "::warning::Windows signing secrets are not configured; binary remains unsigned."
            exit 0
          }
          if ($present.Count -ne 2) {
            throw "Windows signing secret set is incomplete; refusing to produce an ambiguously signed artifact."
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_PFX_BASE64))

            $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse `
                          -Filter signtool.exe -ErrorAction SilentlyContinue |
                        Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
                        Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found on runner" }

            $targets = @(
              Get-ChildItem -Path build -Recurse -File |
                Where-Object { $_.FullName -match '[\\/]Contents[\\/]x86_64-win[\\/]GranularFreeze\.(vst3|clap)$' }
            )
            if ($targets.Count -ne 2) {
              throw "expected exactly one Windows VST3 and one CLAP binary to sign; found $($targets.Count)"
            }

            foreach ($target in $targets) {
              Write-Output "signing $($target.FullName)"
              & $signtool sign /fd SHA256 /td SHA256 `
                /tr https://timestamp.digicert.com `
                /f $pfx /p $env:WIN_PFX_PASSWORD $target.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
              & $signtool verify /pa /all /v $target.FullName
              if ($LASTEXITCODE -ne 0) { throw "signature verification failed" }
            }
            "win_signed=yes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Package macOS bundles
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MAC_SIGNED: ${{ steps.mac_sign.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$MAC_SIGNED" = 'yes' ]; then
            bash ./scripts/package_mac.sh build build/Granular-Freeze-macOS.zip --preserve-signature
          else
            bash ./scripts/package_mac.sh build build/Granular-Freeze-macOS.zip
          fi

      - name: Notarize and staple macOS bundles
        id: mac_notary
        if: >-
          matrix.platform == 'macos' &&
          ((github.event_name == 'push' && github.ref_type == 'tag') ||
           (github.event_name == 'workflow_dispatch' && inputs.sign_artifacts))
        shell: bash
        env:
          MAC_NOTARIZE_API_KEY: ${{ secrets.MAC_NOTARIZE_API_KEY }}
          MAC_NOTARIZE_KEY_ID: ${{ secrets.MAC_NOTARIZE_KEY_ID }}
          MAC_NOTARIZE_ISSUER_ID: ${{ secrets.MAC_NOTARIZE_ISSUER_ID }}
          MAC_SIGNED: ${{ steps.mac_sign.outputs.signed }}
          SIGNING_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_artifacts }}
        run: |
          set -euo pipefail

          present=0
          for value in "$MAC_NOTARIZE_API_KEY" "$MAC_NOTARIZE_KEY_ID" \
                       "$MAC_NOTARIZE_ISSUER_ID"; do
            [ -n "$value" ] && present=$((present + 1))
          done
          if [ "$present" -eq 0 ]; then
            if [ "$SIGNING_REQUIRED" = 'true' ]; then
              echo "::error::manual signing test requested, but notarization secrets are not configured."
              exit 1
            fi
            echo "notarized=no" >> "$GITHUB_OUTPUT"
            echo "::warning::notarization secrets are not configured; the macOS ZIP remains unstapled."
            exit 0
          fi
          if [ "$present" -ne 3 ]; then
            echo "::error::notarization secret set is incomplete; refusing to label the artifact as notarized."
            exit 1
          fi
          if [ "$MAC_SIGNED" != 'yes' ]; then
            echo "::error::notarization credentials are configured but Developer ID signing did not complete."
            exit 1
          fi

          KEY="$RUNNER_TEMP/notary.p8"
          RESULT="$RUNNER_TEMP/notary-result.json"
          LOG="$RUNNER_TEMP/notary-log.json"
          SHIPPED_ARCHIVE=""
          cleanup_notary() {
            rm -f "$KEY" "$RESULT" "$LOG"
            if [ -n "$SHIPPED_ARCHIVE" ] && [ -d "$SHIPPED_ARCHIVE" ]; then
              rm -rf "$SHIPPED_ARCHIVE"
            fi
          }
          trap cleanup_notary EXIT

          printf '%s' "$MAC_NOTARIZE_API_KEY" | base64 -D -o "$KEY"
          chmod 600 "$KEY"
          set +e
          xcrun notarytool submit build/Granular-Freeze-macOS.zip \
                --key "$KEY" --key-id "$MAC_NOTARIZE_KEY_ID" --issuer "$MAC_NOTARIZE_ISSUER_ID" \
                --wait --output-format json > "$RESULT"
          submit_exit=$?
          set -e
          cat "$RESULT"
          submission_id=$(plutil -extract id raw -o - "$RESULT" 2> /dev/null || true)
          submission_status=$(plutil -extract status raw -o - "$RESULT" 2> /dev/null || true)
          log_exit=1
          if [ -n "$submission_id" ]; then
            set +e
            xcrun notarytool log "$submission_id" \
                  --key "$KEY" --key-id "$MAC_NOTARIZE_KEY_ID" --issuer "$MAC_NOTARIZE_ISSUER_ID" \
                  "$LOG"
            log_exit=$?
            set -e
            [ -f "$LOG" ] && cat "$LOG"
          fi
          if [ "$submit_exit" -ne 0 ] || [ "$submission_status" != 'Accepted' ] || [ "$log_exit" -ne 0 ]; then
            echo "::error::Apple notarization failed (submit=$submit_exit, status=${submission_status:-missing}, log=$log_exit)."
            exit 1
          fi

          bundles=()
          while IFS= read -r -d '' bundle; do
            bundles+=("$bundle")
          done < <(find build -type d \
                    \( -name 'GranularFreeze.vst3' -o -name 'GranularFreeze.component' -o -name 'GranularFreeze.clap' \) \
                    ! -path '*/Granular Freeze-macOS/*' -print0)
          if [ "${#bundles[@]}" -ne 3 ]; then
            echo "::error::expected exactly one VST3, AU, and CLAP bundle to staple; found ${#bundles[@]}."
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            xcrun stapler staple "$bundle"
            xcrun stapler validate "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

          bash ./scripts/package_mac.sh build build/Granular-Freeze-macOS.zip --preserve-signature

          # Re-open the distribution ZIP and validate the exact copies users
          # will install before recording a successful notarization status.
          SHIPPED_ARCHIVE=$(mktemp -d "$RUNNER_TEMP/granular-freeze-shipped.XXXXXX")
          ditto -x -k build/Granular-Freeze-macOS.zip "$SHIPPED_ARCHIVE"
          for bundle in \
            "$SHIPPED_ARCHIVE/Granular Freeze-macOS/GranularFreeze.vst3" \
            "$SHIPPED_ARCHIVE/Granular Freeze-macOS/GranularFreeze.component" \
            "$SHIPPED_ARCHIVE/Granular Freeze-macOS/GranularFreeze.clap"; do
            [ -d "$bundle" ] || {
              echo "::error::final macOS ZIP is missing expected bundle: $bundle"
              exit 1
            }
            codesign --verify --deep --strict --verbose=2 "$bundle"
            signature_info=$(codesign --display --verbose=4 "$bundle" 2>&1)
            grep -F 'Authority=Developer ID Application:' <<< "$signature_info" > /dev/null
            grep -F '(runtime)' <<< "$signature_info" > /dev/null
            xcrun stapler validate "$bundle"
          done
          echo "notarized=yes" >> "$GITHUB_OUTPUT"

      - name: Package Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package_win.ps1 -BuildDirectory build -OutputZip build/Granular-Freeze-Windows.zip

      - name: Record signing status
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          MAC_SIGNED: ${{ steps.mac_sign.outputs.signed }}
          MAC_NOTARIZED: ${{ steps.mac_notary.outputs.notarized }}
          WIN_SIGNED: ${{ steps.win_sign.outputs.win_signed }}
        run: |
          set -euo pipefail
          mac_signed=${MAC_SIGNED:-no}
          mac_notarized=${MAC_NOTARIZED:-no}
          win_signed=${WIN_SIGNED:-no}
          for value in "$mac_signed" "$mac_notarized" "$win_signed"; do
            case "$value" in
              yes|no) ;;
              *) echo "::error::invalid signing status value: $value"; exit 1 ;;
            esac
          done
          {
            printf 'platform=%s\n' "$PLATFORM"
            printf 'mac_signed=%s\n' "$mac_signed"
            printf 'mac_notarized=%s\n' "$mac_notarized"
            printf 'win_signed=%s\n' "$win_signed"
          } > "build/signing-status-$PLATFORM.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: granular-freeze-${{ matrix.platform }}
          path: |
            build/Granular-Freeze-*.zip
            build/signing-status-${{ matrix.platform }}.txt
          if-no-files-found: error

  publish:
    name: Create Draft Release Candidate
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
    runs-on: ubuntu-22.04
    needs: [build]
    concurrency:
      group: release-candidate-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Refuse to mutate an existing release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find(candidate => candidate.tag_name === tag);
            if (release) {
              core.setFailed(
                `Release ${release.html_url} already exists for ${tag}; refusing to update it.`
              );
            } else {
              core.info(`No existing release found for ${tag}; creation may proceed.`);
            }

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        shell: bash
        run: ls -laR dist

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum Granular-Freeze-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The notes must describe what was actually produced. Hardcoding
      # "UNSIGNED" would become a lie the moment signing secrets are added,
      # and a mislabelled artifact is worse than an unsigned one.
      - name: Compose release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          for status_file in dist/signing-status-macos.txt dist/signing-status-windows.txt; do
            [ -f "$status_file" ] || { echo "missing status file: $status_file" >&2; exit 1; }
          done
          read_status() {
            local key=$1 file=$2 value
            value=$(awk -F= -v key="$key" '$1 == key { print $2 }' "$file")
            case "$value" in
              yes|no) printf '%s' "$value" ;;
              *) echo "invalid or missing $key in $file" >&2; exit 1 ;;
            esac
          }
          mac_signed=$(read_status mac_signed dist/signing-status-macos.txt)
          mac_notarized=$(read_status mac_notarized dist/signing-status-macos.txt)
          win_signed=$(read_status win_signed dist/signing-status-windows.txt)

          if [ "$mac_signed" = yes ] && [ "$mac_notarized" = yes ] && [ "$win_signed" = yes ]; then
            headline="SIGNED AND NOTARIZED RELEASE CANDIDATE - PRIVATE VERIFICATION ONLY."
          elif [ "$mac_signed" = no ] && [ "$mac_notarized" = no ] && [ "$win_signed" = no ]; then
            headline="UNSIGNED ENGINEERING RELEASE CANDIDATE - DO NOT SELL OR PUBLICLY PUBLISH."
          else
            echo "mixed signing outcomes are not eligible for a release draft" >&2
            exit 1
          fi

          {
            printf 'headline=%s\n' "$headline"
            echo "body<<RELEASE_NOTES_EOF"
            echo "$headline"
            echo
            echo "Granular Freeze v0.2.0 Grain Core candidate."
            echo "Automated checks do not replace exact-artifact DAW validation or owner listening approval."
            echo
            echo "macOS Developer ID signed: $mac_signed"
            echo "macOS notarized and stapled: $mac_notarized"
            echo "Windows Authenticode signed: $win_signed"
            echo
            echo "Verify assets against SHA256SUMS.txt before installing."
            if [ "$mac_signed" = no ] || [ "$mac_notarized" = no ] || [ "$win_signed" = no ]; then
              echo
              echo "Anything marked 'no' above will trigger Gatekeeper or SmartScreen warnings"
              echo "and is not fit for public distribution."
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/Granular-Freeze-*.zip
            dist/SHA256SUMS.txt

      - name: Release summary
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_HEADLINE: ${{ steps.notes.outputs.headline }}
        run: printf 'Created private draft prerelease %s - %s\n' "$RELEASE_TAG" "$RELEASE_HEADLINE"
