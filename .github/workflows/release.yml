name: Release Candidate Build

on:
  push:
    tags:
      - v0.2.0-rc.1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15-intel
          - platform: windows
            runner: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show CMake version
        shell: bash
        run: cmake --version

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cmake -S . -B build -G Xcode \
              '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            cmake -S . -B build
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run behavioural tests
        shell: bash
        run: |
          set -euo pipefail
          for name in GranularFreezeEngineTests GranularFreezeTests; do
            test_binary=$(find build -type f \( -name "$name" -o -name "$name.exe" \) -print -quit)
            if [ -z "$test_binary" ]; then
              echo "$name binary not found under build/" >&2
              exit 1
            fi
            echo "running $test_binary"
            "$test_binary"
          done

      - name: Package macOS bundles
        if: matrix.platform == 'macos'
        shell: bash
        run: bash ./scripts/package_mac.sh build build/Granular-Freeze-macOS.zip

      - name: Package Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package_win.ps1 -BuildDirectory build -OutputZip build/Granular-Freeze-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: granular-freeze-${{ matrix.platform }}
          path: build/Granular-Freeze-*.zip
          if-no-files-found: error

  publish:
    name: Create Draft Release Candidate
    runs-on: ubuntu-22.04
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        shell: bash
        run: ls -laR dist

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum Granular-Freeze-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create unsigned draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          body: |
            UNSIGNED ENGINEERING RELEASE CANDIDATE — DO NOT SELL OR PUBLICLY PUBLISH.

            This draft contains macOS and Windows v0.2.0 Grain Core bundles for DAW validation only.
            The macOS bundles use ad-hoc signatures; the Windows bundle is unsigned.
            Developer ID/notarization and Authenticode signing are required before any public distribution.
          files: |
            dist/Granular-Freeze-*.zip
            dist/SHA256SUMS.txt

      - name: Release summary
        shell: bash
        run: echo "Created unsigned draft prerelease ${{ github.ref_name }}. Do not sell or publicly publish it."
