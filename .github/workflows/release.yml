name: Release Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@v3

      - name: Configure (Xcode)
        run: |
          mkdir -p build
          cd build
          cmake .. -G "Xcode" -DCMAKE_BUILD_TYPE=Release

      - name: Build (Xcode)
        run: |
          cd build
          cmake --build . --config Release --parallel

      - name: Package macOS bundles
        run: |
          set -e
          cd build
          echo "Looking for macOS plugin artifacts..."
          PLUGS=$(find . -type d -name "*.vst3" -o -type d -name "*.component" || true)
          if [ -z "$PLUGS" ]; then
            echo "No macOS plugin bundles found in build/"
          else
            ZIPNAME=plugin-macos-${{ github.run_id }}.zip
            echo "Zipping: $PLUGS -> $ZIPNAME"
            zip -r "$ZIPNAME" $PLUGS
            echo "Packaged: $(pwd)/$ZIPNAME"
            echo "$ZIPNAME" > ../macos_artifact_name.txt
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-macos
          path: |
            build/plugin-macos-*.zip
            build/*.vst3
            build/*.component

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@v3

      - name: Configure (MSVC)
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (MSVC)
        shell: pwsh
        run: |
          cd build
          cmake --build . --config Release --parallel

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -Path build
          $dlls = Get-ChildItem -Path . -Include *.dll -Recurse -File -ErrorAction SilentlyContinue
          if ($dlls) {
            $zip = "plugin-windows-${{ github.run_id }}.zip"
            Compress-Archive -Path $dlls -DestinationPath $zip -Force
            Write-Output "Packaged: $zip"
            Set-Content -Path ..\windows_artifact_name.txt -Value $zip
          } else {
            Write-Output "No Windows artifacts found"
          }

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: |
            build/plugin-windows-*.zip
            build/**/*.dll

  publish:
    name: Create Release and Upload Assets
    runs-on: ubuntu-latest
    needs: [ build-macos, build-windows ]
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-macos

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-windows

      - name: List workspace
        run: |
          echo "Workspace contents:"
          ls -la
          ls -la */** || true

      - name: Create GitHub release (draft)
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS zip to release
        if: ${{ steps.create_release.outputs.upload_url != '' }}
        uses: softprops/action-upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./plugin-macos-*.zip
          asset_name: plugin-macos-${{ github.ref_name }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload windows zip to release
        uses: softprops/action-upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./plugin-windows-*.zip
          asset_name: plugin-windows-${{ github.ref_name }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Optionally upload to Gumroad
        if: ${{ secrets.GUMROAD_PRODUCT_ID && secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          echo "Uploading to Gumroad (product: $GUMROAD_PRODUCT_ID)..."
          # This uses the Gumroad API to create a new version with the asset; adjust as needed.
          ZIPFILE=$(ls -1 plugin-*-*.zip | head -n1)
          if [ -z "$ZIPFILE" ]; then
            echo "No zip file to upload"
            exit 0
          fi
          echo "Uploading $ZIPFILE"
          # Create a new version for the product and attach the file
          curl -s -X POST "https://api.gumroad.com/v2/products/$GUMROAD_PRODUCT_ID/versions" \
            -F "access_token=$GUMROAD_ACCESS_TOKEN" \
            -F "file=@$ZIPFILE" \
            -F "release_notes=Automated release ${{ github.ref_name }} from CI"
        env:
          GUMROAD_PRODUCT_ID: ${{ secrets.GUMROAD_PRODUCT_ID }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}

      - name: Release summary
        run: |
          echo "Draft release created with tag ${{ github.ref_name }}. Check Actions log for uploaded assets."