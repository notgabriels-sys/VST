name: Release Candidate Build

on:
  push:
    tags:
      - v0.1.1-rc.1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15-intel
          - platform: windows
            runner: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show CMake version
        shell: bash
        run: cmake --version

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cmake -S . -B build -G Xcode \
              '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            cmake -S . -B build
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run behavioural tests
        shell: bash
        run: |
          set -euo pipefail
          test_binary=$(find build -type f \( -name 'GranularFreezeTests' -o -name 'GranularFreezeTests.exe' \) -print -quit)
          if [ -z "$test_binary" ]; then
            echo "GranularFreezeTests binary not found under build/" >&2
            exit 1
          fi
          echo "running $test_binary"
          "$test_binary"

      # Signing is gated on secrets being present. With none configured this
      # logs a warning and leaves the ad-hoc signature, so the unsigned
      # candidate path keeps working exactly as before.
      - name: Sign macOS bundles (Developer ID)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MAC_CODESIGN_P12_BASE64: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
          MAC_CODESIGN_P12_PASSWORD: ${{ secrets.MAC_CODESIGN_P12_PASSWORD }}
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CODESIGN_P12_BASE64:-}" ] || [ -z "${MAC_CODESIGN_IDENTITY:-}" ]; then
            echo "::warning::macOS signing secrets not set; keeping ad-hoc signature. Gatekeeper will warn on download."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="${MAC_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          P12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MAC_CODESIGN_P12_BASE64" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "${MAC_CODESIGN_P12_PASSWORD:-}" \
                   -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # --options runtime is required for notarization.
          find build -type d \( -name '*.vst3' -o -name '*.component' \) -print0 |
            while IFS= read -r -d '' bundle; do
              echo "signing $bundle"
              codesign --force --deep --options runtime --timestamp \
                       --sign "$MAC_CODESIGN_IDENTITY" "$bundle"
              codesign --verify --deep --strict --verbose=2 "$bundle"
            done

      - name: Sign Windows binary (Authenticode)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WIN_PFX_BASE64: ${{ secrets.WIN_PFX_BASE64 }}
          WIN_PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WIN_PFX_BASE64) {
            Write-Output "::warning::Windows signing secrets not set; binary will be unsigned. SmartScreen will warn."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_PFX_BASE64))

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse `
                        -Filter signtool.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match 'x64' } |
                      Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found on runner" }

          $targets = Get-ChildItem -Path build -Recurse -Include *.vst3 -File
          if (-not $targets) { throw "no Windows binaries found to sign" }

          foreach ($t in $targets) {
            Write-Output "signing $($t.FullName)"
            & $signtool sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $pfx /p $env:WIN_PFX_PASSWORD $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
            & $signtool verify /pa $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed" }
          }

          Remove-Item $pfx -Force

      - name: Package macOS bundles
        if: matrix.platform == 'macos'
        shell: bash
        run: bash ./scripts/package_mac.sh build build/Granular-Freeze-macOS.zip


      - name: Notarize and staple macOS bundles
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MAC_NOTARIZE_API_KEY: ${{ secrets.MAC_NOTARIZE_API_KEY }}
          MAC_NOTARIZE_KEY_ID: ${{ secrets.MAC_NOTARIZE_KEY_ID }}
          MAC_NOTARIZE_ISSUER_ID: ${{ secrets.MAC_NOTARIZE_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_NOTARIZE_API_KEY:-}" ] || [ -z "${MAC_NOTARIZE_KEY_ID:-}" ] || [ -z "${MAC_NOTARIZE_ISSUER_ID:-}" ]; then
            echo "::warning::notarization secrets not set; skipping. The zip will not be stapled."
            exit 0
          fi

          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$MAC_NOTARIZE_API_KEY" | base64 --decode > "$KEY"
          # --wait blocks until Apple returns a verdict; a rejection fails the job.
          xcrun notarytool submit build/Granular-Freeze-macOS.zip \
                --key "$KEY" --key-id "$MAC_NOTARIZE_KEY_ID" --issuer "$MAC_NOTARIZE_ISSUER_ID" \
                --wait
          rm -f "$KEY"

          # Staple the tickets onto the bundles, then repackage so the shipped
          # zip actually contains them. Stapling the zip itself does nothing.
          find build -type d \( -name '*.vst3' -o -name '*.component' \) -print0 |
            while IFS= read -r -d '' bundle; do
              xcrun stapler staple "$bundle"
              xcrun stapler validate "$bundle"
            done

          bash ./scripts/package_mac.sh build build/Granular-Freeze-macOS.zip

      - name: Package Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package_win.ps1 -BuildDirectory build -OutputZip build/Granular-Freeze-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: granular-freeze-${{ matrix.platform }}
          path: build/Granular-Freeze-*.zip
          if-no-files-found: error

  publish:
    name: Create Draft Release Candidate
    runs-on: ubuntu-22.04
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        shell: bash
        run: ls -laR dist

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum Granular-Freeze-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The notes must describe what was actually produced. Hardcoding
      # "UNSIGNED" would become a lie the moment signing secrets are added,
      # and a mislabelled artifact is worse than an unsigned one.
      - name: Compose release notes
        id: notes
        shell: bash
        env:
          MAC_CODESIGN_P12_BASE64: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
          MAC_NOTARIZE_API_KEY: ${{ secrets.MAC_NOTARIZE_API_KEY }}
          WIN_PFX_BASE64: ${{ secrets.WIN_PFX_BASE64 }}
        run: |
          set -euo pipefail
          mac_signed=no; mac_notarized=no; win_signed=no
          [ -n "${MAC_CODESIGN_P12_BASE64:-}" ] && mac_signed=yes
          [ -n "${MAC_NOTARIZE_API_KEY:-}"   ] && mac_notarized=yes
          [ -n "${WIN_PFX_BASE64:-}"   ] && win_signed=yes

          if [ "$mac_signed" = yes ] && [ "$mac_notarized" = yes ] && [ "$win_signed" = yes ]; then
            headline="SIGNED RELEASE CANDIDATE — verify before publishing."
          else
            headline="UNSIGNED ENGINEERING RELEASE CANDIDATE — DO NOT SELL OR PUBLICLY PUBLISH."
          fi

          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$headline"
            echo
            echo "macOS Developer ID signed: $mac_signed"
            echo "macOS notarized and stapled: $mac_notarized"
            echo "Windows Authenticode signed: $win_signed"
            echo
            echo "Verify assets against SHA256SUMS.txt before installing."
            if [ "$mac_signed" = no ] || [ "$mac_notarized" = no ] || [ "$win_signed" = no ]; then
              echo
              echo "Anything marked 'no' above will trigger Gatekeeper or SmartScreen warnings"
              echo "and is not fit for public distribution."
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/Granular-Freeze-*.zip
            dist/SHA256SUMS.txt

      - name: Release summary
        shell: bash
        run: echo "Created unsigned draft prerelease ${{ github.ref_name }}. Do not sell or publicly publish it."
