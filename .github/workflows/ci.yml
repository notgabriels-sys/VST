name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMake is preinstalled on GitHub-hosted runners; no install step needed.
      - name: Show CMake version
        shell: bash
        run: cmake --version

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cmake -S . -B build -G "Xcode"
          else
            cmake -S . -B build
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -e
          cd build
          echo "Looking for macOS plugin artifacts..."
          PLUGS=$(find . \( -type d -name "*.vst3" -o -type d -name "*.component" \) || true)
          if [ -z "$PLUGS" ]; then
            echo "No macOS plugin bundles found in build/"
          else
            ZIPNAME=plugin-macos-${{ github.run_id }}.zip
            echo "Zipping: $PLUGS -> $ZIPNAME"
            zip -r "$ZIPNAME" $PLUGS
            echo "Packaged: $(pwd)/$ZIPNAME"
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -Path build
          $vst3 = Get-ChildItem -Path . -Include *.vst3 -Recurse -ErrorAction SilentlyContinue
          if ($vst3) {
            $zip = "plugin-windows-${{ github.run_id }}.zip"
            Compress-Archive -Path $vst3 -DestinationPath $zip -Force
            Write-Output "Packaged: $zip"
          } else {
            Write-Output "No Windows artifacts found"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts-${{ matrix.os }}
          path: |
            build/*.zip
          if-no-files-found: warn

# Notes: code-signing and notarization steps are intentionally omitted here and should be added
# after you provide signing secrets. See docs/CI_SECRETS.md for variables and instructions.
