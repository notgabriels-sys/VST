name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMake is preinstalled on GitHub-hosted runners; no install step needed.
      - name: Show CMake version
        shell: bash
        run: cmake --version

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cmake -S . -B build -G "Xcode"
          else
            cmake -S . -B build
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run behavioural tests
        shell: bash
        run: |
          set -euo pipefail
          # Locate the console app: Xcode and MSVC put it in different places.
          BIN=$(find build -type f -name 'GranularFreezeTests' -o -type f -name 'GranularFreezeTests.exe' | head -n1)
          if [ -z "$BIN" ]; then
            echo "test binary not found under build/"; exit 1
          fi
          echo "running $BIN"
          "$BIN"

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          cd build
          # PRODUCT_NAME contains a space ("Granular Freeze"), so an unquoted
          # $PLUGS word-splits the bundle paths and zip sees "Granular" and
          # "Freeze.vst3" as separate, nonexistent files. Hand the paths to zip
          # via -exec so find does the quoting.
          if [ "$(find . \( -type d -name '*.vst3' -o -type d -name '*.component' \) | wc -l)" -eq 0 ]; then
            echo "No macOS plugin bundles found in build/"
            exit 1
          fi
          ZIPNAME=plugin-macos-${{ github.run_id }}.zip
          find . \( -type d -name '*.vst3' -o -type d -name '*.component' \) -exec zip -ryq "$ZIPNAME" {} +
          echo "Packaged: $(pwd)/$ZIPNAME"
          unzip -l "$ZIPNAME" | tail -5

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -Path build
          $vst3 = Get-ChildItem -Path . -Include *.vst3 -Recurse -ErrorAction SilentlyContinue
          if ($vst3) {
            $zip = "plugin-windows-${{ github.run_id }}.zip"
            Compress-Archive -Path $vst3 -DestinationPath $zip -Force
            Write-Output "Packaged: $zip"
          } else {
            Write-Output "No Windows artifacts found"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts-${{ matrix.os }}
          path: |
            build/*.zip
          if-no-files-found: warn

# Notes: code-signing and notarization steps are intentionally omitted here and should be added
# after you provide signing secrets. See docs/CI_SECRETS.md for variables and instructions.
