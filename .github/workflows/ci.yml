name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@v3

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts-${{ matrix.os }}
          path: |
            build/*.vst3
            build/*.component
            build/*.dll

  # Notes: code-signing and notarization steps are intentionally omitted here and should be added
  # after you provide signing secrets. See docs/CI_SECRETS.md for variables and instructions.
