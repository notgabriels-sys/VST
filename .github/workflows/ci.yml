name: CI Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15-intel
          - platform: windows
            runner: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Show CMake version
        shell: bash
        run: cmake --version

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cmake -S . -B build \
              '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            cmake -S . -B build
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run behavioural tests
        shell: bash
        run: |
          set -euo pipefail
          for name in GranularFreezeEngineTests GranularFreezeCoreTests GranularFreezeContractTests; do
            test_binary=$(find build -type f \( -name "$name" -o -name "$name.exe" \) -print -quit)
            if [ -z "$test_binary" ]; then
              echo "$name binary not found under build/" >&2
              exit 1
            fi
            echo "running $test_binary"
            "$test_binary"
          done

      - name: Package macOS bundles
        if: matrix.platform == 'macos'
        shell: bash
        run: bash ./scripts/package_mac.sh build build/Granular-Freeze-macOS.zip

      - name: Package Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package_win.ps1 -BuildDirectory build -OutputZip build/Granular-Freeze-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: granular-freeze-${{ matrix.platform }}
          path: build/Granular-Freeze-*.zip
          if-no-files-found: error
