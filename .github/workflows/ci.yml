name: CI Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15-intel
          - platform: windows
            runner: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Show CMake version
        shell: bash
        run: cmake --version

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cmake -S . -B build \
              '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            cmake -S . -B build
          fi

      - name: Verify pinned Khronos headers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $glext = Get-Item build/_deps/dpf-src/khronos/GL/glext.h
          $khrplatform = Get-Item build/_deps/dpf-src/khronos/KHR/khrplatform.h
          if ($glext.Length -eq 0 -or $khrplatform.Length -eq 0) {
            throw 'Pinned Khronos header is empty.'
          }
          if (-not (Select-String -Quiet -Path $glext.FullName -Pattern 'PFNGLACTIVETEXTUREPROC')) {
            throw 'Pinned glext.h is missing required OpenGL declarations.'
          }

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run behavioural tests
        shell: bash
        run: |
          set -euo pipefail
          for name in GranularFreezeEngineTests GranularFreezeCoreTests GranularFreezeContractTests; do
            test_binary=$(find build -type f \( -name "$name" -o -name "$name.exe" \) -print -quit)
            if [ -z "$test_binary" ]; then
              echo "$name binary not found under build/" >&2
              exit 1
            fi
            echo "running $test_binary"
            "$test_binary"
          done

      - name: Package macOS bundles
        if: matrix.platform == 'macos'
        shell: bash
        run: bash ./scripts/package_mac.sh build build/Granular-Freeze-macOS.zip

      - name: Package Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package_win.ps1 -BuildDirectory build -OutputZip build/Granular-Freeze-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: granular-freeze-${{ matrix.platform }}
          path: build/Granular-Freeze-*.zip
          if-no-files-found: error
